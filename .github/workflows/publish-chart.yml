name: Publish chart to GHCR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Verify tag matches Chart.yaml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          chart_version="$(grep '^version:' Chart.yaml | awk '{print $2}')"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Chart.yaml version $chart_version"
            exit 1
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package .

      - name: Push chart
        run: helm push gateway-route-toggle-*.tgz oci://ghcr.io/${{ github.repository_owner }}
